name: Python - Lint

on:
  push

jobs:
  python_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: no `psf/black@stable` step here on purpose. That action installs
      # whatever black is newest, which drifts away from the `black==24.4.2` pin
      # in requirements-dev.txt and fails on files the pinned version accepts.
      # The pinned `black --check .` below is the gate.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 .

      - name: Run black check
        run: black --check .