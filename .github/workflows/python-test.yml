name: Python - Test

on:
  push:

jobs:
  python_test:
    name: Test on Python ${{ matrix.python_version }} and Django ${{ matrix.django_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        django_version: [ '3.1', '3.2', '4.0', '4.1', '4.2', '5.0' ]
        python_version: [ '3.10', '3.11', '3.12', ]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python_version }}-${{ matrix.django_version }}

    - name: Install dependencies
      # Order matters. requirements.txt pins `Django == 5.0` for local dev, so
      # installing it AFTER the matrix version silently undid the pin and every
      # cell ended up on one Django. The matrix version goes last so it wins.
      #
      # DRF and setuptools are constrained because the open floors resolve to
      # releases that cannot serve the older half of the matrix: DRF >= 3.16
      # requires Django >= 4.2, and setuptools >= 81 drops `pkg_resources`,
      # which the older Django versions still import. DRF 3.15.x spans the whole
      # matrix (Django 3.0 through 5.0).
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -U "djangorestframework>=3.15,<3.16" "setuptools<81"
        pip install -U "Django==${{ matrix.django_version }}"

    - name: Run tests
      run: python -m coverage run runtests.py

    - name: Generate coverage report
      run: python -m coverage xml

    - name: Upload to CodeCov
      uses: codecov/codecov-action@v4
      with:
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}