name: Python - Test

on:
  push:

jobs:
  python_test:
    name: Test on Python ${{ matrix.python_version }} and Django ${{ matrix.django_version }}
    runs-on: ubuntu-latest
    strategy:
      # Without this one failing cell cancels the rest, so a matrix problem
      # shows up one version at a time instead of all at once.
      fail-fast: false
      matrix:
        django_version: [ '3.1', '3.2', '4.0', '4.1', '4.2', '5.0' ]
        python_version: [ '3.10', '3.11', '3.12', ]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python_version }}-${{ matrix.django_version }}

    - name: Install dependencies
      # Order matters. requirements.txt pins `Django == 5.0` for local dev, so
      # installing it AFTER the matrix version silently undid the pin and every
      # cell ended up on one Django. The matrix version goes last so it wins.
      #
      # DRF and setuptools are constrained because the open floors resolve to
      # releases that cannot serve the older half of the matrix: setuptools >= 81
      # drops `pkg_resources`, which the older Django versions still import, and
      # DRF raised its Django floor inside the 3.15 series - 3.15.2 already
      # requires Django >= 4.2 and fails on Django 3.1 with an ImportError for
      # `parse_header_parameters`. 3.15.1 is the exact version verified against
      # Django 3.1, 3.2 and 5.0, so it is pinned rather than ranged.
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -U "djangorestframework==3.15.1" "setuptools<81"
        pip install -U "Django==${{ matrix.django_version }}"

    - name: Run tests
      run: python -m coverage run runtests.py

    - name: Generate coverage report
      run: python -m coverage xml

    - name: Upload to CodeCov
      uses: codecov/codecov-action@v4
      with:
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}